# Exercise the native print host and all UI tests on PRs; the broad FreeBSD/ARM64 gates
# stay on their existing nightly/release schedule.
name: Printing

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-web/**'
      - 'apps/wordcraft-teacher/**'
      - 'crates/classroom/**'
      - 'crates/ui-egui/**'
      - 'packaging/teacher/**'
      - '.github/workflows/printing.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'apps/wordcraft/**'
      - 'apps/wordcraft-web/**'
      - 'apps/wordcraft-teacher/**'
      - 'crates/classroom/**'
      - 'crates/ui-egui/**'
      - 'packaging/teacher/**'
      - '.github/workflows/printing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Print (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build and software-rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Native app and UI Clippy
        run: cargo clippy -p wordcraft -p wordcraft-ui-egui --all-targets --locked -- -D warnings

      - name: Native app and UI tests
        run: cargo test -p wordcraft -p wordcraft-ui-egui --locked

      - name: Browser compatibility
        if: runner.os == 'Linux'
        run: cargo check -p wordcraft-web --target wasm32-unknown-unknown --locked

      - name: Build release binaries (portable)
        run: cargo build --release --locked -p wordcraft -p wordcraft-cli

      - name: Package artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cd target/release
          tar czf ../../dist/wordcraft-${{ runner.os }}-${{ runner.arch }}.tar.gz wordcraft wordcraft-cli
          cd ../..

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          Compress-Archive -Path target\release\wordcraft.exe,target\release\wordcraft-cli.exe -DestinationPath dist\wordcraft-Windows-${{ runner.arch }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          retention-days: 7

  # The browser build is the fourth platform: trunk builds the wasm32 bundle and package.sh zips
  # it into a self-contained static site (packaging/web/README.md).
  web:
    name: Web (wasm32)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install trunk
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: trunk

      - name: Build and package the web bundle
        run: packaging/web/package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-Web-wasm32-${{ github.sha }}
          path: dist/release/wordcraft-web-*.zip
          retention-days: 7

      - name: Upload the web files for the teacher build
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-web-dist
          path: dist/web
          retention-days: 7

  teacher:
    name: Teacher (${{ matrix.name }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: Linux-x86_64 }
          - { os: windows-latest, name: Windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@v4
        with:
          name: wordcraft-web-dist
          path: dist/web

      - name: Build WordCraft Teacher
        run: cargo build --release --locked -p wordcraft-teacher

      - name: Package WordCraft Teacher (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/teacher/WordCraft-Teacher-${{ matrix.name }}"
          cp target/release/wordcraft-teacher "dist/teacher/WordCraft-Teacher-${{ matrix.name }}/"
          WEB="$(dirname "$(find dist/web -name index.html -print -quit)")"
          test -f "$WEB/index.html"
          cp -R "$WEB" "dist/teacher/WordCraft-Teacher-${{ matrix.name }}/web"
          cp packaging/teacher/README.txt "dist/teacher/WordCraft-Teacher-${{ matrix.name }}/"
          cp README.md LICENSE LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "dist/teacher/WordCraft-Teacher-${{ matrix.name }}/" 2>/dev/null || true
          tar -C dist/teacher -czf "dist/wordcraft-teacher-${{ matrix.name }}.tar.gz" "WordCraft-Teacher-${{ matrix.name }}"
          ls -lh dist/wordcraft-teacher-*.tar.gz

      - name: Package WordCraft Teacher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Name = "WordCraft-Teacher-${{ matrix.name }}"
          $Stage = "dist/teacher/$Name"
          New-Item -ItemType Directory -Force -Path "$Stage/web" | Out-Null
          Copy-Item "target/release/wordcraft-teacher.exe" "$Stage/"
          $Index = Get-ChildItem -Path "dist/web" -Filter index.html -Recurse | Select-Object -First 1
          if (-not $Index) { throw "dist/web/index.html not found" }
          Copy-Item "$($Index.Directory.FullName)/*" "$Stage/web/" -Recurse
          Copy-Item "packaging/teacher/README.txt" "$Stage/"
          foreach ($file in 'README.md', 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md') {
            if (Test-Path $file) { Copy-Item $file "$Stage/" }
          }
          Compress-Archive -Path "$Stage/*" -DestinationPath "dist/wordcraft-teacher-${{ matrix.name }}.zip"
          Get-ChildItem dist/wordcraft-teacher-*.zip | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-teacher-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/wordcraft-teacher-*.zip
            dist/wordcraft-teacher-*.tar.gz
          if-no-files-found: error
          retention-days: 7
